name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, dead code, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (type-aware)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Dead code (unused files, exports, dependencies)
        run: npm run knip
      - name: Test with coverage floors
        run: npm run coverage
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build client and server
        run: npm run build && npm run build:server

  container:
    name: Cloud Run container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ecopilot .
      - name: Run container
        run: docker run -d --name ecopilot -p 8080:8080 ecopilot
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs ecopilot; exit 1
      - name: End-to-end smoke test
        run: node scripts/smoke.mjs http://localhost:8080 --container
      - name: Container logs
        if: always()
        run: docker logs ecopilot
